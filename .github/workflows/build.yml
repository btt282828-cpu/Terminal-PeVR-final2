name: Terminal PeVR
# Cuando se ejecuta:
#   - a mano, desde la pestana Actions (boton "Run workflow")
#   - automatico de lunes a viernes a las 23:17 de Madrid: cierre de Nueva York
#     (22:00 en Madrid) + margen para que Yahoo consolide los datos del dia.
#     Minuto 17 y no en punto: en las horas en punto GitHub va saturado y retrasa.
on:
  workflow_dispatch:
  schedule:
    # OJO: GitHub programa SIEMPRE en hora UTC y NO conoce el cambio de hora.
    # Se ponen las DOS citas y el primer trabajo ("hora") descarta la que no toca.
    - cron: "17 21 * * 1-5"      # 23:17 Madrid en HORARIO DE VERANO
    - cron: "17 22 * * 1-5"      # 23:17 Madrid en HORARIO DE INVIERNO
# Permisos: escribir en el repo (para guardar el historico actualizado) y publicar en Pages.
permissions:
  contents: write
  pages: write
  id-token: write
# Si se lanzan dos a la vez, que no se pisen.
concurrency:
  group: terminal
  cancel-in-progress: false
jobs:
  hora:
    # v2 (2026-09-24) — FALLOS CORREGIDOS del filtro anterior:
    #   1) Descartaba la cita sobrante saltandose los pasos del build, pero el trabajo
    #      "publicar" arrancaba igual, no encontraba nada que publicar y acababa en ROJO.
    #      Una ejecucion roja cada dia laborable aunque todo fuera bien.
    #   2) Decidia mirando el RELOJ. Si GitHub se retrasaba (pasa en horas punta), la cita
    #      buena llegaba tarde, el filtro la tomaba por la del otro horario y ese dia NO se
    #      ejecutaba. Ahora decide por la CITA que ha disparado: da igual cuanto se retrase.
    # Si esta cita no toca, se saltan build y publicar enteros: nada en rojo.
    runs-on: ubuntu-latest
    outputs:
      toca: ${{ steps.decide.outputs.toca }}
    steps:
      - name: Decidir si esta cita es la buena
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Lanzado a mano: se ejecuta sin comprobar nada."
            echo "toca=si" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # +0200 = horario de verano en Madrid, +0100 = de invierno
          if [ "$(TZ=Europe/Madrid date +%z)" = "+0200" ]; then
            buena="17 21 * * 1-5"
          else
            buena="17 22 * * 1-5"
          fi
          echo "Madrid: $(TZ=Europe/Madrid date '+%H:%M %Z') · ha disparado: ${{ github.event.schedule }} · la buena hoy: $buena"
          if [ "${{ github.event.schedule }}" = "$buena" ]; then
            echo "toca=si" >> "$GITHUB_OUTPUT"
          else
            echo "Esta cita es la del otro horario: se omite (sin ejecutar ni publicar nada)."
            echo "toca=no" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: hora
    if: needs.hora.outputs.toca == 'si'
    runs-on: ubuntu-latest
    # Sin esto el limite por defecto son 6 horas: un build colgado gastaria minutos a lo tonto.
    timeout-minutes: 120
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          # CORREGIDO: sin esto el runner se queda "colgado sin rama" (detached HEAD)
          # y el git push falla con codigo 128 aunque todo lo demas haya ido bien.
          ref: main
          fetch-depth: 0
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ejecutar el terminal
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python rotacion.py
      - name: Guardar el historico actualizado
        # El programa reescribe historico_seguimiento_NO_BORRAR ENTERO en cada
        # ejecucion (fichas, marcador, libro, ledgers). Por eso NO se debe fusionar con
        # la version del repo: no hay nada que fusionar, el archivo de hoy ya contiene
        # todo el historico. Antes se usaba "git pull --rebase", que intentaba
        # mezclar dos JSON completos, chocaba, dejaba el rebase a medias y perdia
        # el historico de esa ejecucion en silencio.
        # Ahora: se guarda lo generado hoy, se traen los cambios remotos SIN tocar
        # el historico, y se vuelve a poner el de hoy encima. El de hoy siempre gana.
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if [ -z "$(git status --porcelain historico_seguimiento_NO_BORRAR)" ]; then
            echo "Sin cambios en el historico."
            exit 0
          fi
          # copia de seguridad de lo que acaba de generar el build
          rm -rf /tmp/historico_de_hoy
          cp -r historico_seguimiento_NO_BORRAR /tmp/historico_de_hoy
          git checkout -- historico_seguimiento_NO_BORRAR 2>/dev/null || true
          git clean -fd historico_seguimiento_NO_BORRAR 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          # el historico de hoy se impone sobre lo que hubiera en el repo
          rm -rf historico_seguimiento_NO_BORRAR
          cp -r /tmp/historico_de_hoy historico_seguimiento_NO_BORRAR
          git add historico_seguimiento_NO_BORRAR
          if git diff --staged --quiet; then
            echo "El historico ya estaba al dia."
            exit 0
          fi
          git commit -m "historico $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
          echo "Historico guardado correctamente."
      - name: Comprobar que la web se ha generado
        # Red de seguridad: si el terminal no ha escrito su HTML, es mejor que el
        # circulo se ponga ROJO aqui a que se publique una pagina vacia y te enteres
        # mirando el movil. Un HTML de verdad pesa cientos de KB.
        run: |
          test -f site/index.html || { echo "ERROR: no existe site/index.html"; exit 1; }
          tam=$(stat -c%s site/index.html)
          echo "site/index.html = $tam bytes"
          if [ "$tam" -lt 50000 ]; then
            echo "ERROR: el HTML es demasiado pequeno ($tam bytes). Algo ha fallado."
            exit 1
          fi
          echo "Contenido que se va a publicar:"
          ls -la site/
      - name: Preparar la publicacion
        uses: actions/configure-pages@v5
      - name: Empaquetar la web
        uses: actions/upload-pages-artifact@v3
        with:
          # site/index.html      -> terminal completo (la raiz)
          # site/pro/index.html  -> el mismo, para no romper enlaces guardados
          path: site
  publicar:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
